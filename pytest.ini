[pytest]
# Package-name collision guard (v0.3.6).
#
# Root cause: another project is installed editable and injects
#   /root/dev/dualLoopAgent/openharness
# onto sys.path via `_editable_impl_openharness_ai.pth`. That directory
# contains its own `tests/` package, so a bare `import tests` / pytest
# import resolves to THAT project's tests, not ours
# (repro: `python3 -c "import tests; print(tests.__file__)"`).
#
# Anchoring rootdir first makes this repo's own packages (tests, core, ...)
# win resolution regardless of foreign .pth injections. Repo-local, no
# external dependency, no cross-project changes.
pythonpath = .
# [2026-10-07] tests/ 已整体归档为 legacy_tests_v026/（见其 README）。
# v0.3.6 收尾后重建 tests/ 时改回 `testpaths = tests`。
# 当前指 legacy，仅为过渡期可显式运行；不作验收基线。
testpaths = legacy_tests_v026
